name: InstallDotNet
description: Install .NET LTS
schemaVersion: 1.0

phases:
  - name: build
    steps:
      - name: Step1
        action: ExecutePowerShell
        inputs:
          commands:
            - Write-Host "Download script"
            - Invoke-WebRequest -Uri https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1

      - name: Step2
        action: ExecutePowerShell
        inputs:
          commands:
            - Write-Host "Install .NET"
            - powershell -ExecutionPolicy Bypass -File .\dotnet-install.ps1 -Channel LTS -InstallDir C:\dotnet

      - name: Step3
        action: ExecutePowerShell
        inputs:
          commands:
            - Write-Host "Verify"
            - C:\dotnet\dotnet.exe --version